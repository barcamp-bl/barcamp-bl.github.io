<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<!-- og: keeps the light teaser; the page itself shows the dark variant -->
<meta property="og:image" content="{{ site.url }}/images/barcamp-0x07-teaser.png">
<meta property="og:url" content="{{ site.url }}/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="{{ '/stylesheets/terminal.css' | relative_url }}">
</head>
<body>

<nav><div class="wrap">
  <!-- GNU screen window list: the "*" follows the active window. On phones: "barcamp lineup program mapa arhiva javi-se" -->
  <a href="#" class="on"><span class="n">0:</span>barcamp</a>
  <a href="#lineup"><span class="n">1:</span>lineup</a>
  <a href="#program"><span class="n">2:</span>program</a>
  <a href="#lokacija"><span class="n">3:</span><span class="l">lokacija</span><span class="s">mapa</span></a>
  <a href="#arhiva"><span class="n">4:</span>arhiva</a>
  <a href="#podrska"><span class="n">5:</span><span class="l">uključi-se</span><span class="s">javi-se</span></a>
  <span class="clock"><span class="eta-nav">T-??d</span> · 7.11.2026 12:00</span>
</div></nav>

<div class="wrap">
{{ content }}
</div>

<footer><div class="wrap">
  BarCamp BL organizatori · 2015–2026 · <a href="https://github.com/barcamp-bl">github.com/barcamp-bl</a> · exit 0
</div></footer>

<script>
// countdown, then the event-day states. Days are calendar days in the visitor's local calendar.
(() => {
  const now = new Date(), start = new Date('{{ site.start }}');
  const days = Math.round((new Date('{{ site.start | slice: 0, 10 }}') -
    Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  const word = n => n % 10 === 1 && n % 100 !== 11 ? 'dan' : 'dana';   // 1, 21, 31 dan; 11 dana
  const [hero, nav] = days > 0 ? [`${days} ${word(days)}`, `T-${days}d`]
    : days === 0 && now < start ? ['danas!', 'T-0d']
    : days === 0 ? ['u toku', 'running']
    : ['završeno, hvala!', 'exit 0'];
  document.querySelectorAll('.eta').forEach(el => el.textContent = hero);
  document.querySelectorAll('.eta-nav').forEach(el => el.textContent = nav);
})();

// mark the nav tab of the section being read, like screen marks the current window with "*"
(() => {
  const bar = document.querySelector('nav .wrap');
  const tabs = [...bar.querySelectorAll('a')];
  const targets = tabs.map(a => a.hash ? document.querySelector(a.hash) : null);
  let active = tabs[0], lock = false, timer;
  function select(tab) {
    if (tab === active) return;
    active.classList.remove('on'); tab.classList.add('on'); active = tab;
    // keep the tab visible when the bar scrolls sideways (narrow screens)
    if (tab.offsetLeft < bar.scrollLeft || tab.offsetLeft + tab.offsetWidth > bar.scrollLeft + bar.clientWidth)
      bar.scrollLeft = tab.offsetLeft - 8;
  }
  function spy() {
    if (lock) return unlockWhenIdle(150);
    const line = bar.offsetHeight + innerHeight * .3;
    // measure the headings: lokacija is a box inside the program section, its heading is level with program's
    const tops = targets.map(t => t ? (t.querySelector('h2') || t).getBoundingClientRect().top : -Infinity);
    let i = 0;
    // last section whose top passed the line; of two side by side, the first one
    tops.forEach((top, j) => { if (top <= line && Math.abs(top - tops[i]) >= 2) i = j; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) i = tabs.length - 1;
    // program and lokacija sit side by side on wide screens: keep whichever of the two was picked
    if (tabs.some((t, j) => t === active && Math.abs(tops[j] - tops[i]) < 2)) return;
    select(tabs[i]);
  }
  // after a click, keep the clicked tab: ignore the smooth scroll it starts, follow the reader again after that
  function unlockWhenIdle(ms) { clearTimeout(timer); timer = setTimeout(() => { lock = false; }, ms); }
  tabs.forEach(a => a.addEventListener('click', () => { select(a); lock = true; unlockWhenIdle(200); }));
  addEventListener('scroll', spy, { passive: true });
  addEventListener('resize', spy);
  spy();
})();
</script>
</body>
</html>
